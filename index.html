<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pasero vs Gendarme: Audio & Lona Fix - CCO</title>
    <style>
        * { 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none; 
        }
        body { margin: 0; background: #000; color: white; font-family: 'Arial Black', sans-serif; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; background: #111; overflow: hidden; }
        canvas { display: block; width: 100%; height: 60%; border-bottom: 3px solid #ffd700; }

        .ui-top { position: absolute; top: 0; width: 100%; display: flex; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; z-index: 10; gap: 10px; }
        .bar-container { width: 35%; }
        .bar { width: 100%; height: 16px; background: #300; border: 2px solid #fff; border-radius: 8px; overflow: hidden; }
        .fill { height: 100%; width: 100%; transition: width 0.2s; }
        #hp-player { background: #0f0; box-shadow: 0 0 10px #0f0; }
        #hp-enemy { background: #f00; box-shadow: 0 0 10px #f00; }
        .logo-cco { font-size: 24px; color: #fff; text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700; font-style: italic; min-width: 60px; text-align: center; }

        .lona-charge-box { width: 100%; height: 6px; background: #222; border: 1px solid #fff; margin-top: 5px; border-radius: 3px; }
        #lona-fill { width: 0%; height: 100%; background: #0cf; }

        .action-buttons { position: absolute; bottom: 25px; right: 20px; display: grid; grid-template-columns: repeat(2, 75px); gap: 12px; }
        .circle-btn { width: 75px; height: 75px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; cursor: pointer; }
        .btn-big { grid-column: span 2; width: 162px; height: 60px; border-radius: 30px; }
        .disabled { opacity: 0.3 !important; filter: grayscale(1); }

        #victory-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; background: rgba(0,0,0,0.6); z-index: 100; pointer-events: none; }
        .victory-card { font-size: 50px; color: #ffd700; text-shadow: 0 0 20px #000; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="game-container">
        <div id="victory-overlay"><div class="victory-card" id="victory-text">¡VICTORIA!</div></div>

        <div class="ui-top">
            <div class="bar-container">
                <div id="round-text" style="color:#ffd700; font-size: 10px;">RD 1</div>
                <div class="bar"><div id="hp-player" class="fill"></div></div>
                <div class="lona-charge-box"><div id="lona-fill"></div></div>
            </div>
            <div class="logo-cco">CCO</div>
            <div class="bar-container" style="text-align: right;">
                <div style="color:#f00; font-size: 10px;">GENDARME</div>
                <div class="bar"><div id="hp-enemy" class="fill"></div></div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="joystick-container" style="position: absolute; bottom: 35px; left: 35px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%;">
            <div id="joystick-knob" style="position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: #ffd700; border-radius: 50%; border: 2px solid #fff;"></div>
        </div>

        <div class="action-buttons">
            <div class="circle-btn" id="btn-up">SALTO</div>
            <div class="circle-btn" id="btn-shield">ESCUDO</div>
            <div class="circle-btn" id="btn-coca">COCA<br><span id="coca-label">2/2</span></div>
            <div class="circle-btn" id="btn-lona">LONA</div>
            <div class="circle-btn btn-big" id="btn-kick">💥 PATADA DE BURRO 💥</div>
        </div>
    </div>

<script>
// --- CONFIGURACIÓN DE AUDIO ---
const sounds = {
    shoot: new Audio('disparo.mp3'), // Pon tus nombres de archivo aquí
    hit: new Audio('golpe.mp3'),
    jump: new Audio('salto.mp3'),
    explosion: new Audio('explosion.mp3')
};

function playSound(id) {
    if (sounds[id]) {
        sounds[id].currentTime = 0;
        sounds[id].play().catch(() => {}); // Evita errores si el archivo no existe aún
    }
}

// Activar audio en el primer toque (Requisito de navegadores)
window.addEventListener('touchstart', () => {
    Object.values(sounds).forEach(s => { s.play(); s.pause(); });
}, { once: true });

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let screenShake = 0, timeScale = 1, currentRound = 1, isGameOver = false, gameFrame = 0, freezeFrames = 0;

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight * 0.6; }
window.addEventListener('resize', resize); resize();

const sprites = { 
    pasero: new Image(), gendarme: new Image(), fondo: new Image(), 
    lona: new Image(), coca: new Image(), escopeta: new Image(), bala: new Image() 
};
sprites.pasero.src = 'pasero.png'; sprites.gendarme.src = 'gendarme.png'; 
sprites.fondo.src = 'fondo.png'; sprites.lona.src = 'lona.png'; 
sprites.coca.src = 'coca.png'; sprites.escopeta.src = 'escopeta.png';
sprites.bala.src = 'bala.png';

let projectiles = [], particles = [];
let cocaCargador = 2, lastCocaTime = 0, lastKickTime = 0, lonaCharge = 0, isReloadingCoca = false;

class Particle {
    constructor(x, y, color, speed = 3) {
        this.x = x; this.y = y; this.color = color;
        this.life = 1.0; this.size = Math.random() * 5 + 1;
        this.vx = (Math.random() - 0.5) * speed;
        this.vy = (Math.random() - 0.5) * speed;
    }
    update() { this.x += this.vx; this.y += this.vy; this.life -= 0.03; }
    draw() { ctx.save(); ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size); ctx.restore(); }
}

function spawnSparks(x, y, color) {
    for(let i=0; i<15; i++) particles.push(new Particle(x, y, color, 8));
}

class Projectile {
    constructor(x, y, vx, vy, owner, type) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.owner = owner; this.type = type; this.angle = 0;
        this.w = type === 'lona' ? 80 : (type === 'bala' ? 50 : 30);
        this.h = type === 'lona' ? 60 : (type === 'bala' ? 50 : 30);
    }
    update() {
        this.x += this.vx * timeScale; this.y += this.vy * timeScale;
        if (this.type === 'lona') { this.vy += 0.25; this.angle += 0.2; }
        
        let pColor = this.type === 'coca' ? '#f55' : (this.type === 'bala' ? '#ff8800' : '#fff');
        particles.push(new Particle(this.x, this.y, pColor, 2));
        
        ctx.save();
        ctx.translate(this.x, this.y);
        if (this.type === 'coca' && sprites.coca.complete) {
            ctx.drawImage(sprites.coca, -15, -15, 30, 30);
        } else if (this.type === 'lona' && sprites.lona.complete) {
            ctx.rotate(this.angle);
            ctx.drawImage(sprites.lona, -40, -30, 80, 60);
        } else if (this.type === 'bala' && sprites.bala.complete) {
            ctx.drawImage(sprites.bala, -25, -25, 50, 50);
        }
        ctx.restore();
    }
}

class Fighter {
    constructor(x, y, isEnemy = false) {
        this.pos = { x, y }; this.vel = { x: 0, y: 0 };
        this.width = 80; this.height = 120;
        this.health = 100; this.isEnemy = isEnemy;
        this.isShielding = false; this.isKicking = false; this.kickAngle = 0; this.flash = 0;
    }
    draw() {
        ctx.save();
        if (this.flash > 0) {
            ctx.filter = (this.flash % 4 < 2) ? 'brightness(10) hue-rotate(50deg)' : 'brightness(10)';
            this.flash--;
        }
        let dir = (pasero.pos.x < gendarme.pos.x) ? 1 : -1;
        if (this.isEnemy) dir = (pasero.pos.x > this.pos.x) ? -1 : 1;
        
        ctx.translate(this.pos.x + this.width/2, this.pos.y + this.height/2);
        ctx.scale(dir, 1);
        if (this.isKicking) { this.kickAngle += 0.4; ctx.rotate(this.kickAngle); }
        
        const img = this.isEnemy ? sprites.gendarme : sprites.pasero;
        if (img.complete) ctx.drawImage(img, -this.width/2, -this.height/2, this.width, this.height);
        
        if (this.isEnemy && sprites.escopeta.complete) {
            ctx.save(); ctx.scale(-1, 1); 
            ctx.drawImage(sprites.escopeta, -100, -10, 110, 45);
            ctx.restore();
        }
        ctx.restore();
        
        if (!this.isEnemy && this.isShielding && sprites.lona.complete) {
            ctx.save(); ctx.globalAlpha = 0.85;
            let lonaX = (pasero.pos.x < gendarme.pos.x) ? this.pos.x + 55 : this.pos.x - 45;
            ctx.drawImage(sprites.lona, lonaX, this.pos.y, 65, 120); 
            ctx.restore();
        }
    }
    update() {
        this.pos.y += this.vel.y * timeScale;
        if (this.pos.y + this.height < canvas.height - 10) this.vel.y += 0.7;
        else { this.vel.y = 0; this.pos.y = canvas.height - 10 - this.height; }

        if (!this.isEnemy && Math.abs(this.vel.x) > 0) lonaCharge = Math.min(100, lonaCharge + 0.45);

        if (this.isEnemy && !isGameOver) {
            let speed = (0.5 + currentRound * 0.3);
            if (Math.abs(this.pos.x - pasero.pos.x) > 280) this.pos.x += (pasero.pos.x > this.pos.x ? speed : -speed);
            
            let fireRate = Math.max(90, 200 - (currentRound * 15));
            if (gameFrame % fireRate === 0) {
                playSound('shoot');
                let bulletVel = (pasero.pos.x < this.pos.x ? -3.8 : 3.8);
                projectiles.push(new Projectile(this.pos.x, this.pos.y + 40, bulletVel, 0, 'G', 'bala'));
            }
        }
        this.pos.x += this.vel.x * timeScale;
        this.pos.x = Math.max(0, Math.min(canvas.width - this.width, this.pos.x));
        this.draw();
    }
}

let pasero = new Fighter(60, 100);
let gendarme = new Fighter(canvas.width - 160, 100, true);

function handleKO(winner) {
    isGameOver = true; timeScale = 0.1;
    playSound('explosion');
    document.getElementById('victory-overlay').style.display = 'flex';
    if(winner === 'pasero') {
        document.getElementById('victory-text').innerText = "¡VICTORIA!";
        setTimeout(() => {
            currentRound++; document.getElementById('round-text').innerText = "RD " + currentRound;
            pasero.health = 100; lonaCharge = 0; gendarme = new Fighter(canvas.width - 160, 100, true);
            isGameOver = false; timeScale = 1; document.getElementById('victory-overlay').style.display = 'none';
        }, 1500);
    } else {
        document.getElementById('victory-text').innerText = "K.O.";
        setTimeout(() => location.reload(), 2000);
    }
}

const btnCoca = document.getElementById('btn-coca');
btnCoca.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (cocaCargador > 0 && !isReloadingCoca && !isGameOver) {
        playSound('shoot');
        let d = pasero.pos.x < gendarme.pos.x ? 1 : -1;
        projectiles.push(new Projectile(pasero.pos.x + 30*d, pasero.pos.y + 40, d*10, 0, 'P', 'coca'));
        cocaCargador--;
        if(cocaCargador === 0) { isReloadingCoca = true; lastCocaTime = Date.now(); btnCoca.classList.add('disabled'); }
    }
});

document.getElementById('btn-lona').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (lonaCharge >= 100 && !isGameOver) {
        playSound('jump');
        let d = pasero.pos.x < gendarme.pos.x ? 1 : -1;
        // Parábola equilibrada para impacto seguro
        projectiles.push(new Projectile(pasero.pos.x, pasero.pos.y - 10, d*9, -7, 'P', 'lona'));
        lonaCharge = 0;
    }
});

document.getElementById('btn-kick').addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (Date.now() - lastKickTime > 2000 && !isGameOver) {
        lastKickTime = Date.now(); pasero.isKicking = true; pasero.kickAngle = 0;
        if (Math.abs(pasero.pos.x - gendarme.pos.x) < 145) {
            playSound('hit');
            freezeFrames = 6; gendarme.health -= 25; gendarme.flash = 12; screenShake = 30;
            spawnSparks(gendarme.pos.x + 40, gendarme.pos.y + 50, '#ff0');
            if (gendarme.health <= 0) handleKO('pasero');
        }
        setTimeout(() => { pasero.isKicking = false; }, 500);
    }
});

document.getElementById('btn-shield').addEventListener('touchstart', (e) => { e.preventDefault(); pasero.isShielding = true; });
document.getElementById('btn-shield').addEventListener('touchend', (e) => { e.preventDefault(); pasero.isShielding = false; });
document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); if(pasero.vel.y===0) { playSound('jump'); pasero.vel.y=-15; } });

const jKnob = document.getElementById('joystick-knob'), jContainer = jKnob.parentElement;
let jActive = false;
jContainer.addEventListener('touchstart', e => { e.preventDefault(); jActive = true; move(e); });
window.addEventListener('touchmove', e => { if(jActive) move(e); });
window.addEventListener('touchend', () => { jActive = false; jKnob.style.left = '40px'; pasero.vel.x = 0; });
function move(e) {
    const rect = jContainer.getBoundingClientRect(), touch = e.touches[0];
    let x = touch.clientX - rect.left - rect.width/2;
    jKnob.style.left = (40 + Math.max(-40, Math.min(40, x))) + 'px';
    pasero.vel.x = x > 15 ? 7 : (x < -15 ? -7 : 0);
}

function animate() {
    if (freezeFrames > 0) { freezeFrames--; requestAnimationFrame(animate); return; }
    ctx.save();
    if (screenShake > 0) { ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake); screenShake *= 0.85; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (sprites.fondo.complete) ctx.drawImage(sprites.fondo, 0, 0, canvas.width, canvas.height);

    gameFrame++;
    if (isReloadingCoca && Date.now() - lastCocaTime > 2000) { cocaCargador = 2; isReloadingCoca = false; btnCoca.classList.remove('disabled'); }
    document.getElementById('coca-label').innerText = cocaCargador + "/2";
    document.getElementById('lona-fill').style.width = lonaCharge + "%";

    pasero.update(); gendarme.update();

    projectiles = projectiles.filter(p => {
        p.update();
        if (p.owner === 'G' && pasero.isShielding && Math.abs(p.x - pasero.pos.x) < 85) {
            spawnSparks(p.x, p.y, '#0cf');
            return false;
        }
        let target = p.owner === 'G' ? pasero : gendarme;
        
        // SISTEMA DE COLISIÓN MEJORADO (Cajas de impacto dinámicas)
        let hitBoxX = p.type === 'lona' ? 50 : 25;
        let hitBoxY = p.type === 'lona' ? 50 : 25;

        if (p.x > target.pos.x - hitBoxX && p.x < target.pos.x + target.width + hitBoxX && 
            p.y > target.pos.y - hitBoxY && p.y < target.pos.y + target.height + hitBoxY) {
            
            playSound('hit');
            target.health -= (p.type === 'lona' ? 35 : 10);
            target.flash = 12;
            spawnSparks(p.x, p.y, p.owner === 'P' ? '#ff0' : '#f00');
            if (target.health <= 0) handleKO(target === gendarme ? 'pasero' : 'enemy');
            return false;
        }
        return p.x > -100 && p.x < canvas.width + 100 && p.y < canvas.height + 100;
    });

    particles.forEach((p, index) => { p.update(); p.draw(); if(p.life <= 0) particles.splice(index, 1); });
    document.getElementById('hp-player').style.width = pasero.health + "%";
    document.getElementById('hp-enemy').style.width = gendarme.health + "%";
    ctx.restore();
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
